name: Deploy to Firebase on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Create .env file for Frontend Build
        run: |
          echo "VITE_GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env

      - name: Install Dependencies and Build
        run: |
          npm ci
          cd functions
          npm install
          cd ..
          npm run build
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIGNETAI }}'

      - name: Set Secret and Deploy to Firebase
        run: |
          npm install -g firebase-tools
          firebase deploy --only functions,hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive --set-secrets="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"